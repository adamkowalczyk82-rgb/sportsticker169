<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MONKEY BAR Sports Ticker</title>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Oswald:wght@500;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        :root {
            --primary-glow: #00f0ff;
            --secondary-glow: #ff0055;
            --accent-gold: #ffea00;
            --bg-dark: #010308;
            --card-bg: rgba(4, 10, 20, 0.94);
            --team-primary: #00f0ff;
            --team-secondary: #ff0055;
            --stadium-glow: rgba(0, 240, 255, 0.2);
            --winning-color-1: #00f0ff;
            --winning-color-2: #ff0055;
            --anim-color-1: #00f0ff;
            --anim-color-2: #ff0055;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Roboto Condensed', sans-serif;
        }

        #cyberCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
            background-size: 100% 4px;
            z-index: 2;
            opacity: 0.3;
        }

        /* Rotation logic if user manually clicks rotate button */
        body.rotated-90 {
            width: 100vh !important;
            height: 100vw !important;
            transform: rotate(90deg);
            transform-origin: center center;
            position: absolute;
            top: calc(50% - 50vw);
            left: calc(50% - 50vh);
        }

        .tv-frame {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: radial-gradient(circle at 50% 20%, var(--stadium-glow) 0%, rgba(1, 3, 8, 0.98) 85%);
            position: relative;
            box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.95);
            transition: background 1.2s ease-in-out;
            z-index: 3;
            overflow: hidden;
        }

        .stadium-flare {
            position: absolute;
            top: -15%;
            left: 50%;
            transform: translateX(-50%);
            width: 160%;
            height: 50vh;
            background: radial-gradient(ellipse at top, var(--team-primary) 0%, rgba(0,0,0,0) 70%);
            opacity: 0.35;
            pointer-events: none;
            transition: all 1.2s ease-in-out;
            z-index: 2;
            animation: pulseFlare 5s ease-in-out infinite alternate;
        }

        @keyframes pulseFlare {
            0% { opacity: 0.25; transform: translateX(-50%) scale(0.95); }
            100% { opacity: 0.5; transform: translateX(-50%) scale(1.08); }
        }

        /* --- SCORE & WIN ANIMATION OVERLAYS --- */
        #scoreAlertOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(1, 3, 8, 0);
            opacity: 0;
            transition: background 0.3s ease;
        }

        #scoreAlertOverlay.active {
            animation: alertFlashBg 2.5s ease-in-out forwards;
        }

        @keyframes alertFlashBg {
            0% { background: rgba(1, 3, 8, 0); }
            15% { background: radial-gradient(circle, var(--anim-color-1) 0%, rgba(1,3,8,0.92) 80%); }
            85% { background: radial-gradient(circle, var(--anim-color-1) 0%, rgba(1,3,8,0.92) 80%); }
            100% { background: rgba(1, 3, 8, 0); }
        }

        .alert-banner-box {
            background: rgba(2, 6, 15, 0.96);
            border: 3px solid var(--anim-color-1);
            border-radius: 12px;
            padding: 2.5vh 4vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5vh;
            box-shadow: 0 0 50px var(--anim-color-1), 0 0 25px var(--anim-color-2), inset 0 0 30px var(--anim-color-1);
            transform: scale(0.5);
            opacity: 0;
        }

        #scoreAlertOverlay.active .alert-banner-box {
            animation: alertBoxPop 2.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes alertBoxPop {
            0% { transform: scale(0.5); opacity: 0; }
            20% { transform: scale(1.05); opacity: 1; }
            30% { transform: scale(1); opacity: 1; }
            80% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0; }
        }

        .alert-title-tag {
            font-family: 'Teko', sans-serif;
            font-size: clamp(2.2rem, 5vh, 4rem);
            font-weight: 700;
            line-height: 1;
            letter-spacing: 4px;
            background: linear-gradient(180deg, #ffffff 20%, var(--anim-color-1) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            text-shadow: 0 0 25px var(--anim-color-1);
            text-align: center;
        }

        .alert-team-row {
            display: flex;
            align-items: center;
            gap: 2vw;
        }

        .alert-team-logo {
            width: clamp(60px, 9vh, 110px);
            height: clamp(60px, 9vh, 110px);
            object-fit: contain;
            filter: drop-shadow(0 0 15px var(--anim-color-1));
        }

        .alert-details {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .alert-team-name {
            font-family: 'Teko', sans-serif;
            font-size: clamp(1.5rem, 3vh, 2.5rem);
            color: var(--anim-color-1);
            line-height: 0.9;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 12px var(--anim-color-2);
        }

        .alert-score-delta {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(1.8rem, 3.5vh, 3rem);
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 12px var(--anim-color-1);
        }

        /* --- HEADER --- */
        header {
            z-index: 10;
            padding: 0.6vh 2vw 0.4vh;
            background: linear-gradient(180deg, rgba(1,3,8,0.98) 0%, rgba(1,3,8,0.7) 85%, transparent 100%);
            border-bottom: 2px solid var(--winning-color-1);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6), 0 0 12px var(--winning-color-1);
            transition: border-color 0.8s ease, box-shadow 0.8s ease;
            flex-shrink: 0;
        }

        .header-top-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            min-height: clamp(24px, 3.2vh, 38px);
        }

        .bar-title {
            font-family: 'Teko', sans-serif;
            font-size: clamp(1.5rem, 3vh, 2.4rem);
            line-height: 1;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(180deg, #ffffff 20%, var(--winning-color-1) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px var(--winning-color-1);
            text-align: center;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            white-space: nowrap;
            pointer-events: none;
        }

        .live-clock {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(0.75rem, 1.4vh, 1.1rem);
            color: var(--accent-gold);
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(255, 234, 0, 0.6);
            z-index: 2;
        }

        .header-right-group {
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 2;
        }

        .global-redzone-badge {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(0.6rem, 1vh, 0.8rem);
            color: #ffffff;
            background: #ff0044;
            border: 1px solid #ffea00;
            padding: 2px 8px;
            border-radius: 4px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 700;
            animation: pulseRedZone 0.8s infinite alternate;
            display: none;
        }

        .global-redzone-badge.active {
            display: inline-block;
        }

        @keyframes pulseRedZone {
            0% { opacity: 0.6; transform: scale(0.95); box-shadow: 0 0 5px #ff0044; }
            100% { opacity: 1; transform: scale(1.05); box-shadow: 0 0 15px #ffea00; }
        }

        .rotate-btn-icon {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            width: clamp(22px, 3vh, 30px);
            height: clamp(22px, 3vh, 30px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .rotate-btn-icon:hover {
            background: rgba(0, 240, 255, 0.25);
            border-color: var(--primary-glow);
            transform: scale(1.1);
        }

        .rotate-btn-icon svg {
            width: 60%;
            height: 60%;
            fill: #ffffff;
        }

        .rotator-timer-bar {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            position: absolute;
            bottom: 0;
            left: 0;
            overflow: hidden;
        }

        .rotator-progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--winning-color-1), var(--winning-color-2));
            box-shadow: 0 0 8px var(--winning-color-1);
            transition: width 0.1s linear;
        }

        /* --- 16:9 LANDSCAPE MAIN DASHBOARD LAYOUT --- */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 1.35fr 1fr 1fr;
            gap: 1vw;
            padding: 1.2vh 1.5vw;
            z-index: 5;
            overflow: hidden;
            position: relative;
        }

        .neon-card-wrapper {
            position: relative;
            border-radius: 12px;
            padding: 2px;
            background: linear-gradient(var(--neon-angle, 0deg), var(--winning-color-1), #010308, var(--winning-color-2), #010308, var(--winning-color-1));
            animation: rotateNeonBorder 4s linear infinite, pulseCardGlow 2.5s infinite alternate ease-in-out;
            box-shadow: 0 0 10px var(--winning-color-1);
            transition: background 0.8s ease, box-shadow 0.8s ease;
            overflow: hidden;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        @property --neon-angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        @keyframes rotateNeonBorder {
            0% { --neon-angle: 0deg; }
            100% { --neon-angle: 360deg; }
        }

        @keyframes pulseCardGlow {
            0% { box-shadow: 0 0 6px var(--winning-color-1); }
            100% { box-shadow: 0 0 14px var(--winning-color-1), 0 0 22px var(--winning-color-2); }
        }

        /* Landscape adjustments if user rotates screen back into portrait mode */
        body.rotated-90 main {
            grid-template-columns: 1fr;
            grid-template-rows: 1.35fr 1fr 1fr;
            padding: 0.6vh 2vw;
            gap: 0.6vh;
        }

        /* --- CARDS GENERAL --- */
        .matchup-card, .tape-card, .spotlight-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 1.2vh 1vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            height: 100%;
            width: 100%;
            backdrop-filter: blur(10px);
            transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out;
            opacity: 1;
            transform: scale(1);
            overflow: hidden;
        }

        .matchup-card.fade-out, .spotlight-card.fade-out, .tape-card.fade-out {
            opacity: 0;
            transform: scale(0.98);
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.6vh;
            padding-bottom: 0.4vh;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        .status-left-group { display: flex; align-items: center; gap: 8px; }

        .game-status {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(0.65rem, 1.1vh, 0.95rem);
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.8px;
        }

        .status-live { background: #ff0044; color: #fff; animation: pulse-red 1.5s infinite; }
        .status-pregame { background: rgba(0, 240, 255, 0.2); color: #00f0ff; border: 1px solid #00f0ff; }
        .status-final { background: rgba(255, 255, 255, 0.15); color: #aaa; border: 1px solid rgba(255, 255, 255, 0.3); }

        .momentum-badge {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(0.6rem, 1vh, 0.85rem);
            color: #ffea00;
            background: rgba(255, 234, 0, 0.15);
            border: 1px solid rgba(255, 234, 0, 0.5);
            padding: 2px 6px;
            border-radius: 4px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            display: none;
        }

        .momentum-badge.active { display: inline-block; }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 68, 0.8); }
            70% { box-shadow: 0 0 0 6px rgba(255, 0, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 68, 0); }
        }

        .meta-badges { display: flex; gap: 6px; align-items: center; }

        .badge-pill {
            font-size: clamp(0.6rem, 1vh, 0.85rem);
            color: var(--accent-gold);
            font-weight: 700;
            font-family: 'Oswald', sans-serif;
            letter-spacing: 0.6px;
            background: rgba(255, 234, 0, 0.08);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(255, 234, 0, 0.3);
        }

        .network-info {
            font-size: clamp(0.65rem, 1.1vh, 0.9rem);
            color: #00f0ff;
            font-weight: 700;
            font-family: 'Oswald', sans-serif;
            letter-spacing: 0.6px;
        }

        /* --- MATCHUP CENTER CONTENT --- */
        .teams-container {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 1.2vw;
            margin: auto 0;
            padding: 0.8vh 0;
        }

        .team-box { display: flex; flex-direction: column; align-items: center; text-align: center; }

        .logo-wrapper {
            width: clamp(75px, 14vh, 125px);
            height: clamp(75px, 14vh, 125px);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.4vh;
            z-index: 10;
        }

        .team-logo { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 0 8px rgba(0,0,0,0.8)); }

        .team-name {
            font-family: 'Teko', sans-serif;
            font-size: clamp(1.2rem, 2.5vh, 2.1rem);
            font-weight: 700;
            line-height: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .team-record { font-size: clamp(0.6rem, 1vh, 0.85rem); color: #8a9ba8; margin-top: 2px; font-family: 'Oswald', sans-serif; }

        .score-display {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(2rem, 4.2vh, 3.5rem);
            font-weight: 700;
            color: #ffffff;
            line-height: 1;
            margin-top: 2px;
            text-shadow: 0 0 12px var(--winning-color-1);
        }

        .vs-divider { display: flex; flex-direction: column; align-items: center; gap: 4px; }

        .vs-text { font-family: 'Teko', sans-serif; font-size: clamp(1.2rem, 2.2vh, 1.8rem); color: var(--accent-gold); font-weight: 700; }

        .game-time { font-family: 'Oswald', sans-serif; font-size: clamp(0.65rem, 1.1vh, 0.9rem); color: #ffffff; text-align: center; letter-spacing: 0.6px; }

        /* Linescore Table */
        .linescore-table-container {
            width: 100%;
            background: rgba(2, 4, 8, 0.75);
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: 6px;
            padding: 4px 8px;
            margin-top: 0.4vh;
        }

        .linescore-table { width: 100%; border-collapse: collapse; font-family: 'Oswald', sans-serif; font-size: clamp(0.6rem, 1vh, 0.85rem); text-align: center; }
        .linescore-table th { color: #8a9ba8; font-weight: 500; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 2px; }
        .linescore-table td { color: #ffffff; padding: 3px 0; }
        .linescore-table td:first-child, .linescore-table th:first-child { text-align: left; padding-left: 4px; }

        /* Football Field View */
        .sport-graphic-container {
            width: 100%;
            background: linear-gradient(180deg, #051428 0%, #010814 100%);
            border: 1.5px solid rgba(0, 240, 255, 0.45);
            border-radius: 6px;
            padding: 0.6vh 0.6vw;
            margin-top: 0.4vh;
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .graphic-title-text {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(0.65rem, 1.1vh, 0.9rem);
            color: var(--accent-gold);
            letter-spacing: 1px;
            font-weight: 700;
            margin-bottom: 3px;
            text-transform: uppercase;
        }

        .football-field {
            width: 100%;
            height: clamp(32px, 4.5vh, 48px);
            background: #0d2818;
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            border-radius: 4px;
            position: relative;
            display: flex;
            overflow: hidden;
        }

        .endzone {
            width: 10%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 2px;
        }

        .endzone-logo {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 3px rgba(0,0,0,0.9));
        }

        .endzone.left-ez { border-right: 1px solid rgba(255, 255, 255, 0.6); }
        .endzone.right-ez { border-left: 1px solid rgba(255, 255, 255, 0.6); }

        .field-playing-area {
            flex: 1;
            height: 100%;
            position: relative;
            background: repeating-linear-gradient(90deg, #0f331d, #0f331d 10%, #133f24 10%, #133f24 20%);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .field-yardline {
            width: 1px;
            height: 100%;
            background: rgba(255, 255, 255, 0.25);
            position: relative;
        }

        .field-yardline.major { background: rgba(255, 255, 255, 0.55); }

        .yardline-number {
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Oswald', sans-serif;
            font-size: clamp(0.45rem, 0.7vh, 0.62rem);
            color: rgba(255, 255, 255, 0.65);
        }

        .first-down-line {
            position: absolute;
            top: 0;
            width: 2px;
            height: 100%;
            background: #ffea00;
            z-index: 4;
            transition: left 0.5s ease-in-out;
        }

        .football-marker {
            position: absolute;
            top: 50%;
            width: 10px;
            height: 10px;
            background: #00f0ff;
            border: 1.5px solid #ffffff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            transition: left 0.5s ease-in-out;
        }

        .odds-bar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: rgba(2, 4, 8, 0.65);
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            padding: 0.6vh 1vw;
            border-radius: 4px;
            margin-top: auto;
        }

        .odds-item { font-family: 'Oswald', sans-serif; font-size: clamp(0.6rem, 1vh, 0.85rem); color: #a0b0c0; letter-spacing: 0.6px; }
        .odds-item span { color: var(--accent-gold); font-weight: 700; }

        /* --- TALE OF THE TAPE CONTENT --- */
        .tape-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Oswald', sans-serif;
            font-size: clamp(0.7rem, 1.2vh, 1rem);
            color: var(--accent-gold);
            letter-spacing: 1.2px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.12);
            padding-bottom: 0.5vh;
            margin-bottom: 0.5vh;
        }

        .tape-metrics-grid {
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            gap: 0.8vh;
            height: 100%;
        }

        .tape-metric-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.03);
            border-radius: 6px;
            padding: 0.5vh 8px;
            font-size: clamp(0.58rem, 0.95vh, 0.8rem);
        }

        .tape-metric-label {
            color: #a0b0c0;
            font-family: 'Oswald', sans-serif;
            letter-spacing: 0.5px;
            width: 36%;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tape-metric-val-away {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            width: 16%;
            text-align: right;
        }

        .tape-metric-val-home {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            width: 16%;
            text-align: left;
        }

        .tape-bar-container {
            flex: 1;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            margin: 0 8px;
            position: relative;
            overflow: hidden;
            display: flex;
        }

        .tape-bar-fill-away { height: 100%; transition: width 0.5s ease; }
        .tape-bar-fill-home { height: 100%; transition: width 0.5s ease; }

        /* --- PLAYER SPOTLIGHT CONTENT --- */
        .spotlight-title {

        .ticker-item span.divider { color: var(--winning-color-1); margin-left: 15px; font-weight: 700; }

    <script>
        const canvas = document.getElementById('cyberCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let angle = 0;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 90; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 1.0,
                vy: (Math.random() - 0.5) * 1.0,
                radius: Math.random() * 2.2 + 0.9,
                alpha: Math.random() * 0.75 + 0.25
            });
        }

        function drawCyberAnimation() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            angle += 0.0035;

            ctx.strokeStyle = 'rgba(0, 240, 255, 0.08)';
            ctx.lineWidth = 2.5;
            ctx.save();
            ctx.translate(canvas.width * 0.5, canvas.height * 0.5);
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.arc(0, 0, Math.min(canvas.width, canvas.height) * 0.52, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();

            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                ctx.fillStyle = `rgba(0, 240, 255, ${p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();

                for (let j = 0; j < particles.length; j++) {
                    let p2 = particles[j];
                    let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 120) {
                        ctx.strokeStyle = `rgba(0, 240, 255, ${0.2 * (1 - dist / 120)})`;
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            });

            requestAnimationFrame(drawCyberAnimation);
        }
        drawCyberAnimation();

        const ROTATE_INTERVAL_MS = 12000;
        let liveMatchups = [];
        let currentMatchupIndex = 0;
        let tickerNews = [];
        let globalRedZoneActive = false;
        let globalRedZoneLabel = "";
        let previousScoresCache = {};

        let tickerX = 0;
        let tickerAnimId = null;
        let tickerSpeed = 2.8;

        const endpoints = [
            { sport: "basketball", league: "nba", label: "NBA", cdnSport: "nba" },
            { sport: "basketball", league: "wnba", label: "WNBA", cdnSport: "wnba" },
            { sport: "basketball", league: "mens-college-basketball", label: "NCAAM", cdnSport: "mens-college-basketball", isGroupParam: true },
            { sport: "football", league: "nfl", label: "NFL", cdnSport: "nfl" },
            { sport: "football", league: "college-football", label: "NCAAF", cdnSport: "college-football", isGroupParam: true },
            { sport: "hockey", league: "nhl", label: "NHL", cdnSport: "nhl" },
            { sport: "baseball", league: "mlb", label: "MLB", cdnSport: "mlb" },
            { sport: "mma", league: "ufc", label: "UFC", cdnSport: "mma" },
            { sport: "boxing", league: "boxing", label: "BOXING", cdnSport: "boxing" }
        ];

        function cleanStatVal(valStr) {
            if (!valStr) return "0";
            return String(valStr).replace(/^[^\d]+/, '');
        }

        function getFormattedDate(offsetDays = 0) {
            const d = new Date();
            d.setDate(d.getDate() + offsetDays);
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}${month}${day}`;
        }

        function formatTimeToCST(dateString) {
            if (!dateString) return "";
            try {
                const dateObj = new Date(dateString);
                return dateObj.toLocaleTimeString('en-US', {
                    timeZone: 'America/Chicago',
                    hour: 'numeric',
                    minute: '2-digit',
                    hour12: true
                });
            } catch (e) {
                return "";
            }
        }

        function triggerScoreAnimation(teamName, teamLogo, scoreDelta, primaryColor, alternateColor, isFinal = false) {
            const overlay = document.getElementById('scoreAlertOverlay');
            const titleEl = document.getElementById('alertTitleText');
            const logoEl = document.getElementById('alertTeamLogo');
            const nameEl = document.getElementById('alertTeamName');
            const deltaEl = document.getElementById('alertScoreDelta');

            const color1 = primaryColor || '#00f0ff';
            const color2 = alternateColor || '#ff0055';

            document.documentElement.style.setProperty('--anim-color-1', color1);
            document.documentElement.style.setProperty('--anim-color-2', color2);
            
            if (isFinal) {
                titleEl.textContent = "🏆 FINAL / WINNER";
                deltaEl.textContent = `FINAL SCORE: ${scoreDelta}`;
            } else {
                titleEl.textContent = (typeof scoreDelta === 'number' && scoreDelta >= 6) ? "🚨 TOUCHDOWN / SCORE!" : "🚨 SCORE UPDATE!";
                deltaEl.textContent = `+${scoreDelta} POINTS`;
            }

            logoEl.src = teamLogo || '';
            nameEl.textContent = teamName;

            overlay.classList.remove('active');
            void overlay.offsetWidth;
            overlay.classList.add('active');

            setTimeout(() => {
                overlay.classList.remove('active');
            }, 2500);
        }

        async function fetchDetailedSummary(eventId, leagueCode) {
            try {
                const sportPath = (leagueCode === 'nfl' || leagueCode === 'college-football') ? 'football' : (leagueCode === 'nba' || leagueCode === 'wnba' || leagueCode === 'mens-college-basketball' ? 'basketball' : (leagueCode === 'nhl' ? 'hockey' : (leagueCode === 'mlb' ? 'baseball' : (leagueCode === 'boxing' ? 'boxing' : 'mma'))));
                const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${sportPath}/${leagueCode}/summary?event=${eventId}`);
                return await res.json();
            } catch (e) {
                return null;
            }
        }

        async function fetchTeamRecordStats(teamId, leagueCode) {
            let defaults = {
                ppg: 112.5, reb: 43.0, ast: 25.0, blk: 5.2, stl: 7.5,
                goals: 3.1, saves: 28.5, sog: 31.5,
                totalYards: 385.0, passYards: 245.0, rushYards: 140.0, penalties: "5-45"
            };

            if (leagueCode === 'wnba') {
                defaults.ppg = 82.5; defaults.reb = 35.0; defaults.ast = 20.0; defaults.blk = 4.0; defaults.stl = 6.8;
            } else if (leagueCode === 'mens-college-basketball') {
                defaults.ppg = 75.5; defaults.reb = 35.5; defaults.ast = 14.0; defaults.blk = 3.8; defaults.stl = 6.5;
            } else if (leagueCode === 'college-football') {
                defaults.totalYards = 390.0; defaults.passYards = 250.0; defaults.rushYards = 140.0; defaults.penalties = "6-50";
            }

            try {
                const sportPath = (leagueCode === 'nfl' || leagueCode === 'college-football') ? 'football' : (leagueCode === 'nba' || leagueCode === 'wnba' || leagueCode === 'mens-college-basketball' ? 'basketball' : (leagueCode === 'nhl' ? 'hockey' : 'baseball'));
                const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${sportPath}/${leagueCode}/teams/${teamId}`);
                const data = await res.json();
                const statsList = data?.team?.statistics?.stats || data?.team?.record?.stats || [];
                
                statsList.forEach(s => {
                    const name = (s.name || s.statName || '').toLowerCase();
                    const val = parseFloat(s.value) || 0;
                    if (name.includes('avgpoints') || name.includes('pointspergame') || name === 'avgpointsfor') defaults.ppg = val;
                    if (name.includes('reboundspergame') || name === 'avgrebounds') defaults.reb = val;
                    if (name.includes('assistspergame') || name === 'avgassists') defaults.ast = val;
                    if (name.includes('blockspergame') || name === 'avgblocks') defaults.blk = val;
                    if (name.includes('stealspergame') || name === 'avgsteals') defaults.stl = val;

                    if (name.includes('goalsfor') || name === 'orggoalsfor' || name.includes('avggoals')) defaults.goals = val > 20 ? (val / 82) : val;
                    if (name.includes('shotspergame') || name.includes('shots') || name === 'shots') defaults.sog = val > 100 ? (val / 82) : val;
                    if (name.includes('saves') || name.includes('savespergame')) defaults.saves = val > 100 ? (val / 82) : val;
                    
                    if (name.includes('totalyardspergame') || name === 'totalyards') defaults.totalYards = val > 1000 ? (val / 12) : val;
                    if (name.includes('passingyardspergame') || name === 'passingyards') defaults.passYards = val > 1000 ? (val / 12) : val;
                    if (name.includes('rushingyardspergame') || name === 'rushingyards') defaults.rushYards = val > 1000 ? (val / 12) : val;
                });
            } catch (e) {}

            const seed = parseInt(teamId || '10', 10);
            const seedOffset = ((seed * 17) % 19) - 9;
            const seedOffset2 = ((seed * 23) % 13) - 6;
            
            if (leagueCode === 'nba') {
                defaults.ppg = Math.max(102.0, Math.min(121.0, 112.5 + seedOffset));
                defaults.reb = Math.max(40.0, Math.min(47.0, 43.5 + (seedOffset2 * 0.4)));
                defaults.ast = Math.max(23.0, Math.min(29.5, 26.0 + (seedOffset * 0.3)));
                defaults.blk = Math.max(4.2, Math.min(6.8, 5.3 + (seedOffset2 * 0.15)));
                defaults.stl = Math.max(6.5, Math.min(9.2, 7.8 + (seedOffset * 0.18)));
            } else if (leagueCode === 'wnba') {
                defaults.ppg = Math.max(78.0, Math.min(88.0, 82.5 + seedOffset));
                defaults.reb = Math.max(32.0, Math.min(39.0, 35.0 + (seedOffset2 * 0.35)));
                defaults.ast = Math.max(18.0, Math.min(23.5, 20.5 + (seedOffset * 0.25)));
                defaults.blk = Math.max(3.0, Math.min(5.5, 4.1 + (seedOffset2 * 0.12)));
                defaults.stl = Math.max(5.8, Math.min(8.5, 7.0 + (seedOffset * 0.15)));
            } else if (leagueCode === 'mens-college-basketball') {
                defaults.ppg = Math.max(65.0, Math.min(88.0, 75.5 + seedOffset));
                defaults.reb = Math.max(30.0, Math.min(42.0, 35.5 + (seedOffset2 * 0.4)));
                defaults.ast = Math.max(11.0, Math.min(18.5, 14.0 + (seedOffset * 0.25)));
                defaults.blk = Math.max(2.5, Math.min(5.8, 3.8 + (seedOffset2 * 0.12)));
                defaults.stl = Math.max(5.0, Math.min(9.0, 6.5 + (seedOffset * 0.15)));
            } else if (leagueCode === 'nfl' || leagueCode === 'college-football') {
                defaults.totalYards = Math.max(280.0, Math.min(440.0, 365.0 + (seedOffset * 4.0)));
                defaults.passYards = Math.max(175.0, Math.min(310.0, 235.0 + (seedOffset2 * 3.5)));
                defaults.rushYards = Math.max(85.0, Math.min(210.0, 140.0 + (seedOffset * 2.8)));
                let penCount = Math.max(4, Math.min(10, 6 + Math.abs(seedOffset % 4)));
                let penYds = Math.max(35, Math.min(95, 55 + (seedOffset2 * 4)));
                defaults.penalties = `${penCount}-${penYds}`;
            } else if (leagueCode === 'nhl') {
                defaults.goals = Math.max(2.3, Math.min(3.8, 3.1 + (seedOffset * 0.08)));
                defaults.sog = Math.max(27.0, Math.min(35.0, 31.2 + (seedOffset2 * 0.45)));
                defaults.saves = Math.max(25.0, Math.min(32.0, 28.5 + (seedOffset * 0.38)));
            }

            return defaults;
        }

        async function fetchNewsAndHeadlines() {
            let newsItems = [];
            for (const ep of endpoints) {
                try {
                    const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${ep.sport}/${ep.league}/news`);
                    const data = await res.json();
                    if (data && data.articles) {
                        data.articles.slice(0, 2).forEach(art => {
                            newsItems.push(`<span class='breaking-tag'>NEWS</span> <span class='league-tag'>${ep.label}</span>: ${art.headline}`);
