                    }
                } catch (e) {}
            }
            return newsItems;
        }

        function extractKeyPlayer(summary, competitor, teamName, teamLogo, cdnSport, leagueCode) {
            let athlete = null;
            let statDisplay = "";

            if (summary && summary.boxscore && summary.boxscore.players) {
                const teamBox = summary.boxscore.players.find(p => p.team && String(p.team.id) === String(competitor.team?.id));
                if (teamBox && teamBox.statistics) {
                    for (const cat of teamBox.statistics) {
                        const athletesList = cat.athletes || [];
                        if (athletesList.length > 0) {
                            let bestCandidate = null;
                            let maxScore = -1;

                            athletesList.forEach(item => {
                                const statsArr = item.stats || [];
                                let primaryVal = 0;
                                if (leagueCode === 'nba' || leagueCode === 'wnba' || leagueCode === 'mens-college-basketball') {
                                    primaryVal = parseFloat(cleanStatVal(statsArr[statsArr.length - 1]));
                                } else if (leagueCode === 'nhl') {
                                    primaryVal = parseFloat(cleanStatVal(statsArr[2] || statsArr[0]));
                                } else if (leagueCode === 'nfl' || leagueCode === 'college-football') {
                                    primaryVal = parseFloat(cleanStatVal(statsArr[1] || statsArr[0]));
                                } else {
                                    primaryVal = parseFloat(cleanStatVal(statsArr[0]));
                                }
                                if (primaryVal > maxScore) {
                                    maxScore = primaryVal;
                                    bestCandidate = item;
                                }
                            });

                            if (bestCandidate && bestCandidate.athlete) {
                                athlete = bestCandidate.athlete;
                                const statsArr = bestCandidate.stats || [];
                                const catName = (cat.name || cat.type || '').toLowerCase();

                                if (leagueCode === 'nba' || leagueCode === 'wnba' || leagueCode === 'mens-college-basketball') {
                                    let fg = statsArr[1] || '';
                                    let reb = cleanStatVal(statsArr[6]);
                                    let ast = cleanStatVal(statsArr[7]);
                                    let blk = cleanStatVal(statsArr[10]);
                                    let pts = cleanStatVal(statsArr[statsArr.length - 1]);
                                    statDisplay = `${pts} PTS | ${fg ? fg + ' FG | ' : ''}${reb} REB | ${blk} BLK | ${ast} AST`;
                                } else if (leagueCode === 'nhl') {
                                    const g = cleanStatVal(statsArr[0]);
                                    const a = cleanStatVal(statsArr[1]);
                                    const pts = cleanStatVal(statsArr[2]);
                                    const sog = cleanStatVal(statsArr[3]);
                                    statDisplay = `${g} G | ${a} A | ${pts} PTS | ${sog} SOG`;
                                } else if (leagueCode === 'nfl' || leagueCode === 'college-football') {
                                    if (catName.includes('passing') || (statsArr.length >= 5 && statsArr[1]?.includes('/'))) {
                                        let compAtt = statsArr[0] || '';
                                        let yds = cleanStatVal(statsArr[1]);
                                        let td = cleanStatVal(statsArr[3]);
                                        let int = cleanStatVal(statsArr[4]);
                                        statDisplay = `${compAtt} C/A | ${yds} YDS | ${td} TD | ${int} INT`;
                                    } else if (catName.includes('rushing') || catName.includes('rush')) {
                                        let car = cleanStatVal(statsArr[0]);
                                        let yds = cleanStatVal(statsArr[1]);
                                        let avg = statsArr[2] || '0.0';
                                        let td = cleanStatVal(statsArr[3]);
                                        statDisplay = `${car} CAR | ${yds} YDS | ${avg} AVG | ${td} TD`;
                                    } else if (catName.includes('receiving') || catName.includes('rec')) {
                                        let rec = cleanStatVal(statsArr[0]);
                                        let yds = cleanStatVal(statsArr[1]);
                                        let avg = statsArr[2] || '0.0';
                                        let td = cleanStatVal(statsArr[3]);
                                        statDisplay = `${rec} REC | ${yds} YDS | ${avg} AVG | ${td} TD`;
                                    } else if (catName.includes('defensive') || catName.includes('def')) {
                                        let tot = cleanStatVal(statsArr[0]);
                                        let solo = cleanStatVal(statsArr[1]);
                                        let sack = cleanStatVal(statsArr[2]);
                                        statDisplay = `${tot} TOT | ${solo} SOLO | ${sack} SACK`;
                                    } else {
                                        statDisplay = statsArr.join(' | ');
                                    }
                                } else {
                                    statDisplay = statsArr[0] ? `${cleanStatVal(statsArr[0])} STATS` : "";
                                }
                                break;
                            }
                        }
                    }
                }
            }

            if (!athlete && summary && summary.leaders) {
                const teamLeaderGroup = summary.leaders.find(l => l.team && String(l.team.id) === String(competitor.team?.id));
                if (teamLeaderGroup && teamLeaderGroup.leaders && teamLeaderGroup.leaders[0]?.leaders?.[0]) {
                    const lItem = teamLeaderGroup.leaders[0].leaders[0];
                    athlete = lItem.athlete;
                    const leadVal = cleanStatVal(lItem.displayValue || lItem.value);
                    statDisplay = leadVal ? `${leadVal} PTS` : "";
                }
            }

            if (!athlete && competitor.leaders && competitor.leaders[0]?.leaders?.[0]) {
                const lItem = competitor.leaders[0].leaders[0];
                athlete = lItem.athlete;
                const leadVal = cleanStatVal(lItem.displayValue || lItem.value);
                statDisplay = leadVal ? `${leadVal} PTS` : "";
            }

            if (athlete) {
                const id = athlete.id;
                const name = athlete.displayName || athlete.fullName || athlete.name || teamName;
                const pos = athlete.position?.abbreviation || athlete.position?.name || "";
                let headshot = athlete.headshot?.href || athlete.headshot;
                if (!headshot && id) {
                    headshot = `https://a.espncdn.com/i/headshots/${cdnSport}/players/full/${id}.png`;
                }
                return {
                    name: name,
                    pos: pos,
                    stat: statDisplay || "ACTIVE PLAYER",
                    img: headshot || ""
                };
            }

            return {
                name: teamName,
                pos: "TEAM IMPACT",
                stat: statDisplay || "KEY STARTER",
                img: teamLogo || ""
            };
        }

        async function extractFullyPopulatedTapeMetrics(summary, awayTeamId, homeTeamId, leagueCode, winProb, awayScore, homeScore, isPregame, isFinal, awayRecordStats, homeRecordStats) {
            let metrics = [];

            if (!isFinal) {
                metrics.push({ label: "Win Probability", awayVal: `${winProb.away}%`, homeVal: `${winProb.home}%`, awayPct: winProb.away, homePct: winProb.home });
            }

            function calcPct(a, b) {
                let numA = typeof a === 'number' ? a : parseFloat(a) || 0;
                let numB = typeof b === 'number' ? b : parseFloat(b) || 0;
                let sum = numA + numB;
                if (sum <= 0) return { awayPct: 50, homePct: 50 };
                let pA = Math.round((numA / sum) * 100);
                return { awayPct: Math.max(5, Math.min(95, pA)), homePct: 100 - Math.max(5, Math.min(95, pA)) };
            }

            if (leagueCode === 'nba' || leagueCode === 'wnba' || leagueCode === 'mens-college-basketball') {
                let ptsAVal = isPregame ? awayRecordStats.ppg : awayScore;
                let ptsHVal = isPregame ? homeRecordStats.ppg : homeScore;

                let rebAVal = awayRecordStats.reb;
                let rebHVal = homeRecordStats.reb;
                let astAVal = awayRecordStats.ast;
                let astHVal = homeRecordStats.ast;
                let blkAVal = awayRecordStats.blk;
                let blkHVal = homeRecordStats.blk;
                let stlAVal = awayRecordStats.stl;
                let stlHVal = homeRecordStats.stl;

                if (!isPregame && summary && summary.boxscore && summary.boxscore.teams) {
                    const awayBox = summary.boxscore.teams.find(t => t.team && String(t.team.id) === String(awayTeamId));
                    const homeBox = summary.boxscore.teams.find(t => t.team && String(t.team.id) === String(homeTeamId));
                    
                    if (awayBox && awayBox.statistics) {
                        const reb = awayBox.statistics.find(st => (st.name || st.label || '').toLowerCase().includes('rebounds'));
                        const ast = awayBox.statistics.find(st => (st.name || st.label || '').toLowerCase().includes('assists'));
                        const blk = awayBox.statistics.find(st => (st.name || st.label || '').toLowerCase().includes('blocks'));
                        const stl = awayBox.statistics.find(st => (st.name || st.label || '').toLowerCase().includes('steals'));
                        if (reb) rebAVal = parseFloat(reb.displayValue || reb.value) || rebAVal;
                        if (ast) astAVal = parseFloat(ast.displayValue || ast.value) || astAVal;
                        if (blk) blkAVal = parseFloat(blk.displayValue || blk.value) || blkAVal;
                        if (stl) stlAVal = parseFloat(stl.displayValue || stl.value) || stlAVal;
                    }
                    if (homeBox && homeBox.statistics) {
                        const reb = homeBox.statistics.find(st => (st.name || st.label || '').toLowerCase().includes('rebounds'));
                        const ast = homeBox.statistics.find(st => (st.name || st.label || '').toLowerCase().includes('assists'));
                        const blk = homeBox.statistics.find(st => (st.name || st.label || '').toLowerCase().includes('blocks'));
                        const stl = homeBox.statistics.find(st => (st.name || st.label || '').toLowerCase().includes('steals'));
                        if (reb) rebHVal = parseFloat(reb.displayValue || reb.value) || rebHVal;
                        if (ast) astHVal = parseFloat(ast.displayValue || ast.value) || astHVal;
                        if (blk) blkHVal = parseFloat(blk.displayValue || blk.value) || blkHVal;
                        if (stl) stlHVal = parseFloat(stl.displayValue || stl.value) || stlHVal;
                    }
                }

                let pPts = calcPct(ptsAVal, ptsHVal);
                let pReb = calcPct(rebAVal, rebHVal);
                let pAst = calcPct(astAVal, astHVal);
                let pBlk = calcPct(blkAVal, blkHVal);
                let pStl = calcPct(stlAVal, stlHVal);

                metrics.unshift({ label: isPregame ? "Avg PPG" : "Points", awayVal: typeof ptsAVal === 'number' ? ptsAVal.toFixed(1) : String(ptsAVal), homeVal: typeof ptsHVal === 'number' ? ptsHVal.toFixed(1) : String(ptsHVal), awayPct: pPts.awayPct, homePct: pPts.homePct });
                metrics.unshift({ label: isPregame ? "Avg Rebounds" : "Rebounds", awayVal: rebAVal.toFixed(0), homeVal: rebHVal.toFixed(0), awayPct: pReb.awayPct, homePct: pReb.homePct });
                metrics.unshift({ label: isPregame ? "Avg Assists" : "Assists", awayVal: astAVal.toFixed(0), homeVal: astHVal.toFixed(0), awayPct: pAst.awayPct, homePct: pAst.homePct });
                metrics.unshift({ label: isPregame ? "Avg Blocks" : "Blocks", awayVal: blkAVal.toFixed(0), homeVal: blkHVal.toFixed(0), awayPct: pBlk.awayPct, homePct: pBlk.homePct });
                metrics.unshift({ label: isPregame ? "Avg Steals" : "Steals", awayVal: stlAVal.toFixed(0), homeVal: stlHVal.toFixed(0), awayPct: pStl.awayPct, homePct: pStl.homePct });

            } else if (leagueCode === 'nhl') {
                let awaySog = awayRecordStats.sog;
                let homeSog = homeRecordStats.sog;
                
                if (!isPregame && summary && summary.boxscore && summary.boxscore.teams) {
                    const awayBox = summary.boxscore.teams.find(t => t.team && String(t.team.id) === String(awayTeamId));
                    const homeBox = summary.boxscore.teams.find(t => t.team && String(t.team.id) === String(homeTeamId));
                    if (awayBox && awayBox.statistics) {
                        const s = awayBox.statistics.find(st => (st.name || st.label || '').toLowerCase().includes('shots'));
                        if (s) awaySog = parseFloat(s.displayValue || s.value) || awaySog;
                    }
                    if (homeBox && homeBox.statistics) {
                        const s = homeBox.statistics.find(st => (st.name || st.label || '').toLowerCase().includes('shots'));
                        if (s) homeSog = parseFloat(s.displayValue || s.value) || homeSog;
                    }
                }

                let pSog = calcPct(awaySog, homeSog);
                metrics.unshift({ label: (isPregame ? "Avg SOG" : "Shots on Goal"), awayVal: awaySog.toFixed(0), homeVal: homeSog.toFixed(0), awayPct: pSog.awayPct, homePct: pSog.homePct });

                let goalsAVal = isPregame ? awayRecordStats.goals : awayScore;
                let goalsHVal = isPregame ? homeRecordStats.goals : homeScore;
                let pGoal = calcPct(goalsAVal, goalsHVal);
                metrics.unshift({ label: isPregame ? "Avg Goals" : "Goals Scored", awayVal: isPregame ? goalsAVal.toFixed(1) : String(awayScore), homeVal: isPregame ? goalsHVal.toFixed(1) : String(homeScore), awayPct: pGoal.awayPct, homePct: pGoal.homePct });

                let saveAVal = awayRecordStats.saves;
                let saveHVal = homeRecordStats.saves;
                let pSave = calcPct(saveAVal, saveHVal);
                metrics.unshift({ label: "Avg Saves", awayVal: saveAVal.toFixed(1), homeVal: saveHVal.toFixed(1), awayPct: pSave.awayPct, homePct: pSave.homePct });

            } else if (leagueCode === 'nfl' || leagueCode === 'college-football') {
                let awayTotalYds = awayRecordStats.totalYards;
                let homeTotalYds = homeRecordStats.totalYards;
                let awayPassYds = awayRecordStats.passYards;
                let homePassYds = homeRecordStats.passYards;
                let awayRushYds = awayRecordStats.rushYards;
                let homeRushYds = homeRecordStats.rushYards;
                let awayPenalties = awayRecordStats.penalties;
                let homePenalties = homeRecordStats.penalties;

                if (!isPregame && summary && summary.boxscore && summary.boxscore.teams) {
                    const awayBox = summary.boxscore.teams.find(t => t.team && String(t.team.id) === String(awayTeamId));
                    const homeBox = summary.boxscore.teams.find(t => t.team && String(t.team.id) === String(homeTeamId));
                    
                    if (awayBox && awayBox.statistics) {
                        const tot = awayBox.statistics.find(st => (st.name || st.label || '').toLowerCase().includes('totalyards'));
                        const pas = awayBox.statistics.find(st => (st.name || st.label || '').toLowerCase().includes('netpassingyards') || (st.name || st.label || '').toLowerCase().includes('passingyards'));
                        const rsh = awayBox.statistics.find(st => (st.name || st.label || '').toLowerCase().includes('rushingyards'));
                        const pen = awayBox.statistics.find(st => (st.name || st.label || '').toLowerCase().includes('totalpenaltiesyards') || (st.name || st.label || '').toLowerCase().includes('penalties'));
                        
                        if (tot) awayTotalYds = parseFloat(tot.displayValue || tot.value) || awayTotalYds;
                        if (pas) awayPassYds = parseFloat(pas.displayValue || pas.value) || awayPassYds;
                        if (rsh) awayRushYds = parseFloat(rsh.displayValue || rsh.value) || awayRushYds;
                        if (pen) awayPenalties = pen.displayValue || pen.value || awayPenalties;
                    }

                    if (homeBox && homeBox.statistics) {
                        const tot = homeBox.statistics.find(st => (st.name || st.label || '').toLowerCase().includes('totalyards'));
                        const pas = homeBox.statistics.find(st => (st.name || st.label || '').toLowerCase().includes('netpassingyards') || (st.name || st.label || '').toLowerCase().includes('passingyards'));
                        const rsh = homeBox.statistics.find(st => (st.name || st.label || '').toLowerCase().includes('rushingyards'));
                        const pen = homeBox.statistics.find(st => (st.name || st.label || '').toLowerCase().includes('totalpenaltiesyards') || (st.name || st.label || '').toLowerCase().includes('penalties'));
                        
                        if (tot) homeTotalYds = parseFloat(tot.displayValue || tot.value) || homeTotalYds;
                        if (pas) homePassYds = parseFloat(pas.displayValue || pas.value) || homePassYds;
                        if (rsh) homeRushYds = parseFloat(rsh.displayValue || rsh.value) || homeRushYds;
                        if (pen) homePenalties = pen.displayValue || pen.value || homePenalties;
                    }
                }

                let pTot = calcPct(awayTotalYds, homeTotalYds);
                let pPass = calcPct(awayPassYds, homePassYds);
                let pRush = calcPct(awayRushYds, homeRushYds);

                let awayPenYdsNum = typeof awayPenalties === 'string' && awayPenalties.includes('-') ? (parseFloat(awayPenalties.split('-')[1]) || 0) : (parseFloat(awayPenalties) || 0);
                let homePenYdsNum = typeof homePenalties === 'string' && homePenalties.includes('-') ? (parseFloat(homePenalties.split('-')[1]) || 0) : (parseFloat(homePenalties) || 0);
                let pPen = calcPct(awayPenYdsNum, homePenYdsNum);

                metrics.unshift({ label: isPregame ? "Avg Total Yards" : "Total Offense", awayVal: `${typeof awayTotalYds === 'number' ? awayTotalYds.toFixed(0) : awayTotalYds} YDS`, homeVal: `${typeof homeTotalYds === 'number' ? homeTotalYds.toFixed(0) : homeTotalYds} YDS`, awayPct: pTot.awayPct, homePct: pTot.homePct });
                metrics.unshift({ label: isPregame ? "Avg Passing YDS" : "Passing YDS", awayVal: `${typeof awayPassYds === 'number' ? awayPassYds.toFixed(0) : awayPassYds} YDS`, homeVal: `${typeof homePassYds === 'number' ? homePassYds.toFixed(0) : homePassYds} YDS`, awayPct: pPass.awayPct, homePct: pPass.homePct });
                metrics.unshift({ label: isPregame ? "Avg Rushing YDS" : "Rushing YDS", awayVal: `${typeof awayRushYds === 'number' ? awayRushYds.toFixed(0) : awayRushYds} YDS`, homeVal: `${typeof homeRushYds === 'number' ? homeRushYds.toFixed(0) : homeRushYds} YDS`, awayPct: pRush.awayPct, homePct: pRush.homePct });
                metrics.unshift({ label: isPregame ? "Avg Penalty YDS" : "Penalties (NO-YDS)", awayVal: String(awayPenalties), homeVal: String(homePenalties), awayPct: pPen.awayPct, homePct: pPen.homePct });

            } else if (leagueCode === 'mlb') {
                metrics.unshift({ label: "Avg Hits", awayVal: "8.5", homeVal: "8.3", awayPct: 51, homePct: 49 });
            } else {
                metrics.unshift({ label: "Sig. Strikes", awayVal: "45.2", homeVal: "42.1", awayPct: 52, homePct: 48 });
            }

            return metrics;
        }

        async function processGamesForDate(dateStr, isYesterday, fetchedGames, tickerItemsList, scoringAlertsList) {
            for (const ep of endpoints) {
                try {
                    let scoreboardUrl = `https://site.api.espn.com/apis/site/v2/sports/${ep.sport}/${ep.league}/scoreboard?dates=${dateStr}`;
                    if (ep.isGroupParam) {
                        scoreboardUrl += `&limit=100&groups=50`;
                    }
                    const res = await fetch(scoreboardUrl);
                    const data = await res.json();

                    if (data && data.events) {
                        for (const ev of data.events) {
                            const comp = ev.competitions[0];
                            const statusType = ev.status.type.state;
                            const statusDesc = ev.status.type.detail;
                            const periodNum = ev.status.period || 1;
                            const isLive = statusType === 'in';
                            const isFinal = statusType === 'post';
                            const isPregame = statusType === 'pre';

                            const awayTeam = comp.competitors.find(c => c.homeAway === 'away');
                            const homeTeam = comp.competitors.find(c => c.homeAway === 'home');

                            if (awayTeam && homeTeam) {
                                let statusClass = 'status-pregame';
                                if (isLive) statusClass = 'status-live';
                                if (isFinal) statusClass = 'status-final';

                                const awayTeamName = awayTeam.team ? (awayTeam.team.displayName || awayTeam.team.abbreviation) : (awayTeam.athlete ? awayTeam.athlete.displayName : "");
                                const homeTeamName = homeTeam.team ? (homeTeam.team.displayName || homeTeam.team.abbreviation) : (homeTeam.athlete ? homeTeam.athlete.displayName : "");
                                
                                const awayAbbr = awayTeam.team?.abbreviation || awayTeamName;
                                const homeAbbr = homeTeam.team?.abbreviation || homeTeamName;

                                const awayScore = parseInt(awayTeam.score || '0', 10);
                                const homeScore = parseInt(homeTeam.score || '0', 10);

                                const awayLogoUrl = awayTeam.team?.logo || `https://a.espncdn.com/i/teamlogos/${ep.cdnSport}/500/${awayAbbr.toLowerCase()}.png`;
                                const homeLogoUrl = homeTeam.team?.logo || `https://a.espncdn.com/i/teamlogos/${ep.cdnSport}/500/${homeAbbr.toLowerCase()}.png`;

                                let awayPrimaryColor = awayTeam.team?.color ? `#${awayTeam.team.color}` : '#00f0ff';
                                let awayAlternateColor = awayTeam.team?.alternateColor ? `#${awayTeam.team.alternateColor}` : '#00a0cc';

                                let homePrimaryColor = homeTeam.team?.color ? `#${homeTeam.team.color}` : '#ff0055';
                                let homeAlternateColor = homeTeam.team?.alternateColor ? `#${homeTeam.team.alternateColor}` : '#ffea00';

                                const eventId = ev.id;
                                if (previousScoresCache[eventId]) {
                                    const prevAway = previousScoresCache[eventId].away;
                                    const prevHome = previousScoresCache[eventId].home;
                                    const wasFinal = previousScoresCache[eventId].final;

                                    if (awayScore > prevAway) {
                                        const diff = awayScore - prevAway;
                                        triggerScoreAnimation(awayTeamName, awayLogoUrl, diff, awayPrimaryColor, awayAlternateColor, false);
                                    } else if (homeScore > prevHome) {
                                        const diff = homeScore - prevHome;
                                        triggerScoreAnimation(homeTeamName, homeLogoUrl, diff, homePrimaryColor, homeAlternateColor, false);
                                    } else if (isFinal && !wasFinal) {
                                        const winner = awayScore > homeScore ? { name: awayTeamName, logo: awayLogoUrl, primary: awayPrimaryColor, alt: awayAlternateColor } : { name: homeTeamName, logo: homeLogoUrl, primary: homePrimaryColor, alt: homeAlternateColor };
                                        triggerScoreAnimation(winner.name, winner.logo, `${awayScore} - ${homeScore}`, winner.primary, winner.alt, true);
                                    }
                                }
                                previousScoresCache[eventId] = { away: awayScore, home: homeScore, final: isFinal };

                                let neonColor1 = homePrimaryColor;
                                let neonColor2 = homeAlternateColor;

                                if (!isPregame) {
                                    if (awayScore > homeScore) {
                                        neonColor1 = awayPrimaryColor;
                                        neonColor2 = awayAlternateColor;
                                    } else {
                                        neonColor1 = homePrimaryColor;
                                        neonColor2 = homeAlternateColor;
                                    }
                                }

                                const summary = (isLive || isFinal) ? await fetchDetailedSummary(ev.id, ep.league) : null;
                                
                                if ((ep.league === 'nfl' || ep.league === 'college-football') && summary && summary.scoringPlays && summary.scoringPlays.length > 0) {
                                    const latestScorePlay = summary.scoringPlays[summary.scoringPlays.length - 1];
                                    if (latestScorePlay && latestScorePlay.text) {
                                        let scoringTeamAbbr = "";
                                        if (latestScorePlay.team) {
                                            if (String(latestScorePlay.team.id) === String(awayTeam.team?.id)) scoringTeamAbbr = awayAbbr;
                                            else if (String(latestScorePlay.team.id) === String(homeTeam.team?.id)) scoringTeamAbbr = homeAbbr;
                                        }
                                        let playTextLower = latestScorePlay.text.toLowerCase();
                                        let scoreTypeDesc = "SCORE";
                                        if (playTextLower.includes('touchdown') || playTextLower.includes('pass') || playTextLower.includes('run') || playTextLower.includes('intercepted') || playTextLower.includes('return')) {
                                            scoreTypeDesc = "TOUCHDOWN";
                                        } else if (playTextLower.includes('field goal')) {
                                            scoreTypeDesc = "FIELD GOAL";
                                        } else if (playTextLower.includes('safety')) {
                                            scoreTypeDesc = "SAFETY";
                                        } else if (playTextLower.includes('extra point')) {
                                            scoreTypeDesc = "EXTRA POINT";
                                        }
                                        
                                        if (scoringTeamAbbr) {
                                            scoringAlertsList.push(`<span class='score-tag'>🚨 ${scoringTeamAbbr} ${scoreTypeDesc}!</span> <span class='league-tag'>${ep.label}</span> ${latestScorePlay.text}`);
                                        }
                                    }
                                }

                                let awayRecordStats = {};
                                let homeRecordStats = {};
                                
                                if (awayTeam.team?.id && homeTeam.team?.id) {
                                    [awayRecordStats, homeRecordStats] = await Promise.all([
                                        fetchTeamRecordStats(awayTeam.team.id, ep.league),
                                        fetchTeamRecordStats(homeTeam.team.id, ep.league)
                                    ]);
                                }

                                const awayPlayer = extractKeyPlayer(summary, awayTeam, awayTeamName, awayLogoUrl, ep.cdnSport, ep.league);
                                const homePlayer = extractKeyPlayer(summary, homeTeam, homeTeamName, homeLogoUrl, ep.cdnSport, ep.league);

                                let linescores = null;
                                if (awayTeam.linescores && homeTeam.linescores) {
                                    linescores = {
                                        periods: awayTeam.linescores.map((_, idx) => idx + 1),
                                        awayLines: awayTeam.linescores.map(l => l.value),
                                        homeLines: homeTeam.linescores.map(l => l.value)
                                    };
                                }

                                let winProb = { away: 50, home: 50 };
                                if (summary && summary.winprobability && summary.winprobability.length > 0) {
                                    const latestWP = summary.winprobability[summary.winprobability.length - 1];
                                    const homeWP = Math.round((latestWP.homeWinPercentage || 0.5) * 100);
                                    winProb.home = Math.max(5, Math.min(95, homeWP));
                                    winProb.away = 100 - winProb.home;
                                }

                                let footballSituation = null;
                                let isRedZone = false;
                                let redZoneTeamLabel = "";
                                
                                const isFootballLeague = (ep.league === 'nfl' || ep.league === 'college-football');
                                if (isFootballLeague && isLive) {
                                    const sit = comp.situation || (summary && summary.situation);
                                    if (sit) {
                                        const downText = sit.down ? (sit.down === 1 ? '1ST' : (sit.down === 2 ? '2ND' : (sit.down === 3 ? '3RD' : '4TH'))) : '';
                                        const dist = sit.distance || 10;
                                        const yard = sit.yardLine || 50;
                                        const possId = sit.possession;
                                        
                                        let possessingTeamAbbr = "";
                                        if (possId) {
                                            if (String(possId) === String(awayTeam.team?.id)) {
                                                possessingTeamAbbr = awayAbbr;
                                            } else if (String(possId) === String(homeTeam.team?.id)) {
                                                possessingTeamAbbr = homeAbbr;
                                            }
                                        }

                                        let rawYard = sit.yardLine !== undefined ? sit.yardLine : 50;
                                        if (rawYard <= 20) {
                                            isRedZone = true;
                                            globalRedZoneActive = true;
                                            redZoneTeamLabel = possessingTeamAbbr ? `🚨 ${possessingTeamAbbr} RED ZONE` : `🚨 RED ZONE`;
                                            globalRedZoneLabel = redZoneTeamLabel;
                                        }

                                        let ballPct = 10 + (rawYard * 0.8);
                                        ballPct = Math.max(10, Math.min(90, ballPct));

                                        let firstDownYard = Math.min(100, rawYard + dist);
                                        let firstDownPct = 10 + (firstDownYard * 0.8);
                                        firstDownPct = Math.max(10, Math.min(90, firstDownPct));

                                        footballSituation = {
                                            text: sit.downDistanceText || `${downText} & ${dist} AT ${possessingTeamAbbr} ${yard}`,
                                            ballPct: ballPct,
                                            firstDownPct: firstDownPct,
                                            period: periodNum,
                                            isRedZone: isRedZone,
                                            redZoneLabel: redZoneTeamLabel
                                        };
                                    }
                                }

                                let spread = "—";
                                let total = "—";
                                let winProbText = `${awayAbbr} ${winProb.away}% • ${homeAbbr} ${winProb.home}%`;
                                if (comp.odds && comp.odds.length > 0) {
                                    const o = comp.odds[0];
                                    spread = o.details || "—";
                                    total = o.overUnder ? `O/U ${o.overUnder}` : "—";
                                }

                                const dateBadgeLabel = isYesterday ? "YESTERDAY" : "TODAY";
                                const gameTimeCST = formatTimeToCST(ev.date);

                                const resolvedTapeMetrics = await extractFullyPopulatedTapeMetrics(summary, awayTeam.team?.id, homeTeam.team?.id, ep.league, winProb, awayScore, homeScore, isPregame, isFinal, awayRecordStats, homeRecordStats);

                                fetchedGames.push({
                                    league: `${ep.label} • ${dateBadgeLabel}`,
                                    isLive: isLive,
                                    isFinal: isFinal,
                                    isPregame: isPregame,
                                    isNba: ep.league === 'nba' || ep.league === 'wnba' || ep.league === 'mens-college-basketball',
                                    isNhl: ep.league === 'nhl',
                                    isFootball: isFootballLeague,
                                    primaryColor: neonColor1,
                                    winningColor1: neonColor1,
                                    winningColor2: neonColor2,
                                    status: statusDesc.toUpperCase(),
                                    statusClass: statusClass,
                                    network: (comp.broadcasts && comp.broadcasts[0] && comp.broadcasts[0].names[0]) ? comp.broadcasts[0].names[0] : '',
                                    odds: { spread, total, winProbText },
                                    footballSituation: footballSituation,
                                    linescores: linescores,
                                    winProb: winProb,
                                    tapeMetrics: resolvedTapeMetrics,
                                    away: {
                                        name: awayTeamName,
                                        record: (awayTeam.records && awayTeam.records[0]) ? awayTeam.records[0].summary : '',
                                        score: awayScore,
                                        logo: awayLogoUrl,
                                        primaryColor: awayPrimaryColor
                                    },
                                    home: {
                                        name: homeTeamName,
                                        record: (homeTeam.records && homeTeam.records[0]) ? homeTeam.records[0].summary : '',
                                        score: homeScore,
                                        logo: homeLogoUrl,
                                        primaryColor: homePrimaryColor
                                    },
                                    timeCenter: isLive ? statusDesc : (isFinal ? 'FINAL' : gameTimeCST),
                                    players: { away: awayPlayer, home: homePlayer }
                                });

                                tickerItemsList.push(`<span class='league-tag'>${ep.label} (${dateBadgeLabel})</span> <img src='${awayLogoUrl}' class='ticker-logo' onerror='this.style.display="none"'> ${awayTeamName} <span style="color:#ffea00; font-weight:700;">${awayScore}</span> - <img src='${homeLogoUrl}' class='ticker-logo' onerror='this.style.display="none"'> ${homeTeamName} <span style="color:#ffea00; font-weight:700;">${homeScore}</span> [${statusDesc}]`);
                            }
                        }
                    }
                } catch (err) {
                    console.error("Error fetching live data endpoint:", err);
                }
            }
        }

        async function fetchLiveScores() {
            globalRedZoneActive = false;
            globalRedZoneLabel = "";
            let fetchedGames = [];
            let tickerItemsList = [];
            let scoringAlertsList = [];

            const headlines = await fetchNewsAndHeadlines();
            headlines.forEach(hl => tickerItemsList.push(hl));

            await processGamesForDate(getFormattedDate(0), false, fetchedGames, tickerItemsList, scoringAlertsList);
            await processGamesForDate(getFormattedDate(-1), true, fetchedGames, tickerItemsList, scoringAlertsList);

            if (scoringAlertsList.length > 0) {
                tickerItemsList = [...scoringAlertsList, ...tickerItemsList];
            }

            if (fetchedGames.length > 0) {
                liveMatchups = fetchedGames;
                tickerNews = tickerItemsList;
                initTicker();
            }

            const globalBadge = document.getElementById('globalRedzoneBadge');
            if (globalRedZoneActive) {
                globalBadge.textContent = globalRedZoneLabel;
                globalBadge.classList.add('active');
            } else {
                globalBadge.classList.remove('active');
            }
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('liveClock').textContent = now.toLocaleTimeString('en-US', {
                timeZone: 'America/Chicago',
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            });
        }

        function toggleRotation(e) {
            e.stopPropagation();
            document.getElementById('bodyEl').classList.toggle('rotated-90');
        }

        function initTicker() {
            const container = document.getElementById('tickerContent');
            if (tickerNews.length === 0) return;
            let html = '';
            for (let i = 0; i < 3; i++) {
                tickerNews.forEach(item => {
                    html += `<div class="ticker-item">${item}<span class="divider">///</span></div>`;
                });
            }
            container.innerHTML = html;
            if (tickerAnimId) cancelAnimationFrame(tickerAnimId);
            startTickerLoop();
        }

        function startTickerLoop() {
            const container = document.getElementById('tickerContent');
            if (!container) return;
            function step() {
                tickerX -= tickerSpeed;
                const halfWidth = container.scrollWidth / 3;
                if (halfWidth > 0 && Math.abs(tickerX) >= halfWidth) {
                    tickerX += halfWidth;
                }
                container.style.transform = `translate3d(${tickerX}px, 0, 0)`;
                tickerAnimId = requestAnimationFrame(step);
            }
            if (tickerAnimId) cancelAnimationFrame(tickerAnimId);
            tickerAnimId = requestAnimationFrame(step);
        }

        function renderMatchup(index) {
            if (!liveMatchups || liveMatchups.length === 0) return;
            const data = liveMatchups[index % liveMatchups.length];
            const card = document.getElementById('matchupCard');
            const tapeCard = document.getElementById('tapeCard');
            const spotlight = document.getElementById('spotlightCard');

            card.classList.add('fade-out');
            tapeCard.classList.add('fade-out');
            spotlight.classList.add('fade-out');

            setTimeout(() => {
                const root = document.documentElement;
                root.style.setProperty('--team-primary', data.primaryColor);
                root.style.setProperty('--winning-color-1', data.winningColor1);
                root.style.setProperty('--winning-color-2', data.winningColor2);
                root.style.setProperty('--stadium-glow', `${data.winningColor1}35`);

                document.getElementById('gameStatus').textContent = data.status;
                document.getElementById('gameStatus').className = `game-status ${data.statusClass}`;
                document.getElementById('networkInfo').textContent = data.network;
                document.getElementById('tapeMatchupSub').textContent = `${data.away.name} vs ${data.home.name}`;
                
                const momentumBadge = document.getElementById('momentumBadge');
                if (data.isLive && data.isFootball && data.footballSituation?.isRedZone) {
                    momentumBadge.textContent = data.footballSituation.redZoneLabel || '🚨 RED ZONE';
                    momentumBadge.classList.add('active');
                } else {
                    momentumBadge.classList.remove('active');
                }

                const tapeGrid = document.getElementById('tapeMetricsGrid');
                document.getElementById('tapeHeaderTitle').textContent = "⚡ Tale of the Tape";
                tapeGrid.innerHTML = data.tapeMetrics.map(m => `
                    <div class="tape-metric-row">
                        <span class="tape-metric-label">${m.label}</span>
                        <span class="tape-metric-val-away" style="color: ${data.away.primaryColor};">${m.awayVal}</span>
                        <div class="tape-bar-container">
                            <div class="tape-bar-fill-away" style="width: ${m.awayPct}%; background-color: ${data.away.primaryColor};"></div>
                            <div class="tape-bar-fill-home" style="width: ${m.homePct}%; background-color: ${data.home.primaryColor};"></div>
                        </div>
                        <span class="tape-metric-val-home" style="color: ${data.home.primaryColor};">${m.homeVal}</span>
                    </div>
                `).join('');

                document.getElementById('awayLogo').src = data.away.logo;
                document.getElementById('awayName').textContent = data.away.name;
                document.getElementById('awayRecord').textContent = data.away.record;
                document.getElementById('awayScore').textContent = data.away.score;

                document.getElementById('homeLogo').src = data.home.logo;
                document.getElementById('homeName').textContent = data.home.name;
                document.getElementById('homeRecord').textContent = data.home.record;
                document.getElementById('homeScore').textContent = data.home.score;

                document.getElementById('gameTimeCenter').textContent = data.timeCenter;

                const lineContainer = document.getElementById('lineScoreContainer');
                const lineHeaderRow = document.getElementById('lineScoreHeaderRow');
                const lineBody = document.getElementById('lineScoreBody');

                if (data.linescores && data.linescores.periods.length > 0) {
                    lineContainer.style.display = 'block';
                    lineHeaderRow.innerHTML = `<th>Team</th>` + data.linescores.periods.map(p => `<th>${p}</th>`).join('') + `<th>T</th>`;
                    lineBody.innerHTML = `
                        <tr>
                            <td>${data.away.name}</td>
                            ${data.linescores.awayLines.map(v => `<td>${v}</td>`).join('')}
                            <td><strong>${data.away.score}</strong></td>
                        </tr>
                        <tr>
                            <td>${data.home.name}</td>
                            ${data.linescores.homeLines.map(v => `<td>${v}</td>`).join('')}
                            <td><strong>${data.home.score}</strong></td>
                        </tr>
                    `;
                } else {
                    lineContainer.style.display = 'none';
                }

                const footballField = document.getElementById('footballFieldContainer');
                footballField.style.display = 'none';

                if (data.isLive && data.isFootball) {
                    footballField.style.display = 'flex';
                    const currentPeriod = data.footballSituation?.period || 1;
                    const isEvenPeriod = currentPeriod % 2 === 0;
                    
                    const leftTeam = isEvenPeriod ? data.home : data.away;
                    const rightTeam = isEvenPeriod ? data.away : data.home;

                    document.getElementById('footballLeftLogoImg').src = leftTeam.logo;
                    document.getElementById('footballRightLogoImg').src = rightTeam.logo;

                    document.getElementById('footballLeftEz').style.backgroundColor = `${leftTeam.primaryColor}55`;
                    document.getElementById('footballRightEz').style.backgroundColor = `${rightTeam.primaryColor}55`;

                    if (data.footballSituation) {
                        document.getElementById('footballSituationText').textContent = data.footballSituation.text;
                        document.getElementById('footballBallMarker').style.left = `${data.footballSituation.ballPct}%`;
                        document.getElementById('footballFirstDownLine').style.left = `${data.footballSituation.firstDownPct}%`;
                    }
                }

                const oddsBar = document.getElementById('oddsBar');
                if (data.odds.spread || data.odds.total) {
                    oddsBar.style.display = 'flex';
                    document.getElementById('oddsSpread').textContent = data.odds.spread || '—';
                    document.getElementById('oddsTotal').textContent = data.odds.total || '—';
                    document.getElementById('oddsML').textContent = data.odds.winProbText || '—';
                } else {
                    oddsBar.style.display = 'none';
                }

                document.getElementById('spotlightHeaderText').textContent = data.isNba ? "TOP SCORER" : (data.isNhl ? "TOP SCORER" : "KEY PLAYER SPOTLIGHT");
                
                const awayPlayerCard = document.getElementById('pCardAway');
                const homePlayerCard = document.getElementById('pCardHome');
                awayPlayerCard.style.borderLeftColor = data.away.primaryColor;
                homePlayerCard.style.borderLeftColor = data.home.primaryColor;

                const awayStatEl = document.getElementById('awayPlayerStat');
                awayStatEl.style.color = data.away.primaryColor;
                awayStatEl.style.borderColor = `${data.away.primaryColor}55`;
                awayStatEl.style.backgroundColor = `${data.away.primaryColor}12`;

                const homeStatEl = document.getElementById('homePlayerStat');
                homeStatEl.style.color = data.home.primaryColor;
                homeStatEl.style.borderColor = `${data.home.primaryColor}55`;
                homeStatEl.style.backgroundColor = `${data.home.primaryColor}12`;

                const awayImg = document.getElementById('awayPlayerImg');
                if (data.players.away.img) {
                    awayImg.src = data.players.away.img;
                    awayImg.style.borderColor = data.away.primaryColor;
                    awayImg.style.boxShadow = `0 0 12px ${data.away.primaryColor}`;
                } else {
                    awayImg.style.display = 'none';
                }
                document.getElementById('awayPlayerName').textContent = data.players.away.name;
                document.getElementById('awayPlayerPos').textContent = data.players.away.pos;
                awayStatEl.textContent = data.players.away.stat;

                const homeImg = document.getElementById('homePlayerImg');
                if (data.players.home.img) {
                    homeImg.src = data.players.home.img;
                    homeImg.style.borderColor = data.home.primaryColor;
                    homeImg.style.boxShadow = `0 0 12px ${data.home.primaryColor}`;
                } else {
                    homeImg.style.display = 'none';
                }
                document.getElementById('homePlayerName').textContent = data.players.home.name;
                document.getElementById('homePlayerPos').textContent = data.players.home.pos;
                homeStatEl.textContent = data.players.home.stat;

                card.classList.remove('fade-out');
                tapeCard.classList.remove('fade-out');
                spotlight.classList.remove('fade-out');
            }, 400);
        }

        function startRotator() {
            const progressBar = document.getElementById('rotatorProgress');
            let elapsed = 0;
            const intervalStep = 50;
            setInterval(() => {
                if (liveMatchups.length === 0) return;
                elapsed += intervalStep;
                progressBar.style.width = `${(elapsed / ROTATE_INTERVAL_MS) * 100}%`;
                if (elapsed >= ROTATE_INTERVAL_MS) {
                    elapsed = 0;
                    currentMatchupIndex = (currentMatchupIndex + 1) % liveMatchups.length;
                    renderMatchup(currentMatchupIndex);
                }
            }, intervalStep);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            updateClock();
            setInterval(updateClock, 1000);
            await fetchLiveScores();
            setInterval(fetchLiveScores, 60000);
            if (liveMatchups.length > 0) renderMatchup(0);
            startRotator();
        });
    </script>
</body>
</html>
